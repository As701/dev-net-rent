<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чаты - DachaGo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-blue: #2599C8;
            --soft-gray: #F7F9FC;
            --text-dark: #1A1D1E;
            --text-light: #9BA5B7;
            --white: #FFFFFF;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--soft-gray); margin: 0; padding-bottom: 110px; color: var(--text-dark); -webkit-font-smoothing: antialiased; }
        
        /* HEADER */
        .header { background: var(--white); padding: 50px 24px 25px; border-radius: 0 0 35px 35px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); position: sticky; top: 0; z-index: 1000; }
        .header-title { font-weight: 900; font-size: 24px; margin: 0; }

        /* CHAT LIST */
        .chat-container { padding: 20px; }
        .chat-list { background: var(--white); border-radius: 32px; overflow: hidden; border: 1px solid #F0F3F6; box-shadow: 0 10px 40px rgba(0,0,0,0.02); }
        .chat-item { display: flex; align-items: center; gap: 15px; padding: 18px 20px; border-bottom: 1px solid #F8F9FA; cursor: pointer; text-decoration: none; color: inherit; transition: 0.3s; }
        .chat-item:last-child { border-bottom: none; }
        .chat-item:active { background: var(--soft-gray); transform: scale(0.98); }
        
        .chat-avatar { width: 55px; height: 55px; border-radius: 20px; object-fit: cover; background: var(--soft-gray); }
        .chat-info { flex: 1; min-width: 0; }
        .chat-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .chat-name { font-weight: 800; font-size: 15px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-time { font-size: 10px; color: var(--text-light); font-weight: 700; }
        .chat-msg { font-size: 13px; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; font-weight: 500; }
        .chat-unread { width: 8px; height: 8px; background: var(--brand-blue); border-radius: 50%; margin-left: 10px; }

        /* EMPTY STATE */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
        .empty-state i { font-size: 40px; margin-bottom: 15px; opacity: 0.3; }
        .empty-state p { font-weight: 700; font-size: 14px; }

        /* BOTTOM NAV - MASTER STANDARD 74x74 */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); padding: 15px 24px 35px; display: flex; justify-content: space-between; align-items: center; border-radius: 35px 35px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.05); z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #D1D8E0; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .nav-item.active { color: var(--brand-blue); }
        .nav-item i { font-size: 22px; }
        .nav-item span { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .nav-create { position: relative; margin-top: -65px; }
        .create-btn { background: var(--brand-blue); width: 74px; height: 74px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--white); font-size: 26px; box-shadow: 0 10px 25px rgba(37, 153, 200, 0.4); border: 6px solid var(--white); cursor: pointer; transition: 0.3s; }
        .create-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="header-title" style="margin-bottom: 20px;">Чаты</h1>
        
        <div class="tabs-container" style="display: flex; background: #E2E8F0; padding: 4px; border-radius: 16px; gap: 4px;">
            <div class="tab-item active" data-tab="owners" style="flex: 1; text-align: center; padding: 10px; font-size: 12px; font-weight: 800; color: var(--text-light); cursor: pointer; border-radius: 12px; transition: 0.3s;">
                Владельцы
            </div>
            <div class="tab-item" data-tab="system" style="flex: 1; text-align: center; padding: 10px; font-size: 12px; font-weight: 800; color: var(--text-light); cursor: pointer; border-radius: 12px; transition: 0.3s;">
                Система
            </div>
        </div>
    </header>

    <style>
        .tab-item.active { background: var(--white); color: var(--brand-blue); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .system-notif { display: flex; gap: 15px; padding: 20px; border-bottom: 1px solid #F8F9FA; transition: 0.3s; }
        .system-icon { width: 45px; height: 45px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .bg-success { background: #E8F5E9; color: #2E7D32; }
        .bg-info { background: #E3F2FD; color: #2599C8; }
        .bg-danger { background: #FFEBEE; color: #D32F2F; }
    </style>

    <main class="chat-container">
        <div id="chat-list" class="chat-list">
            <div class="empty-state">
                <i class="fas fa-comment-dots"></i>
                <p>Загрузка сообщений...</p>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="map.html" class="nav-item">
            <i class="fas fa-map-marked-alt"></i>
            <span>Карта</span>
        </a>
        <a href="index.html" class="nav-item">
            <i class="fas fa-th-large"></i>
            <span>Главная</span>
        </a>
        <div class="nav-create">
            <a href="create.html" class="create-btn"><i class="fas fa-plus"></i></a>
        </div>
        <a href="messages.html" class="nav-item active">
            <i class="fas fa-comment-dots"></i>
            <span>Чаты</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user-circle"></i>
            <span>Профиль</span>
        </a>
    </nav>

    <script src="config.js"></script>
    <script src="messages.js"></script>
</body>
</html>
