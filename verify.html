<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение Email - DachaGo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2599C8;
            --brand-color: #2b96cd;
            --soft-gray: #F7F9FC;
            --text-dark: #1A1D1E;
            --text-light: #9BA5B7;
            --border-color: #F0F3F6;
        }
        body { font-family: 'Inter', sans-serif; background: white; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { max-width: 400px; width: 100%; padding: 30px; text-align: center; }
        h1 { font-weight: 800; font-size: 24px; margin-bottom: 10px; }
        p { color: var(--text-light); font-size: 14px; margin-bottom: 30px; }
        
        /* ЧАСТЬ 2: Стили для аккуратных инпутов */
        .code-container {
            display: flex;
            justify-content: center;
            gap: 10px; /* Расстояние между квадратиками */
            margin-top: 20px;
            margin-bottom: 25px;
            width: 100%;
        }

        .code-input {
            width: 45px !important;  /* Жестко задаем ширину */
            height: 45px !important; /* Жестко задаем высоту */
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border: 1px solid #E2E8F0;
            border-radius: 12px;     /* Скругление как на макете */
            background-color: #F8FAFC;
            color: #1E293B;
            outline: none;
            transition: all 0.2s ease;
            padding: 0 !important;   /* Сбрасываем внутренние отступы */
        }

        .code-input:focus {
            border-color: #3B82F6;   /* Синяя рамка при фокусе */
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .submit-btn { width: 100%; background: var(--primary-blue); color: white; border: none; padding: 18px; border-radius: 20px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .submit-btn:disabled { opacity: 0.5; }
        .resend-box { margin-top: 25px; font-size: 14px; }
        .resend-link { color: var(--brand-color); font-weight: 700; text-decoration: none; }
        .resend-link.disabled { color: var(--text-light); pointer-events: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Введите код</h1>
        <p>Мы отправили 6-значный код на почту <br><strong id="user-email" style="color: var(--text-dark);"></strong></p>
        
        <!-- ЧАСТЬ 2: HTML-структура контейнера -->
        <div class="code-container">
            <input type="text" maxlength="1" class="code-input" pattern="\d*" inputmode="numeric">
            <input type="text" maxlength="1" class="code-input" pattern="\d*" inputmode="numeric">
            <input type="text" maxlength="1" class="code-input" pattern="\d*" inputmode="numeric">
            <input type="text" maxlength="1" class="code-input" pattern="\d*" inputmode="numeric">
            <input type="text" maxlength="1" class="code-input" pattern="\d*" inputmode="numeric">
            <input type="text" maxlength="1" class="code-input" pattern="\d*" inputmode="numeric">
        </div>

        <button class="submit-btn" id="btn-verify">Подтвердить</button>

        <div class="resend-box">
            <span id="timer-text">Отправить повторно через 00:59</span>
            <a href="#" id="resend-link" class="resend-link disabled">Отправить код повторно</a>
        </div>
    </div>
    <script src="config.js"></script>
    <script>
        const API_URL = window.DachaGoConfig?.apiUrl || 'https://dachago-server.onrender.com/api/v1';
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        document.getElementById('user-email').innerText = email;

        const fields = document.querySelectorAll('.code-input');
        fields.forEach((f, i) => {
            f.addEventListener('input', () => {
                f.value = f.value.replace(/\D/g, '');
                if (f.value && i < fields.length - 1) fields[i+1].focus();
            });
            f.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !f.value && i > 0) fields[i-1].focus();
            });
        });

        document.getElementById('btn-verify').addEventListener('click', async () => {
            const code = Array.from(fields).map(f => f.value).join('');
            if (code.length < 6) return;

            try {
                const res = await fetch(`${API_URL}/auth/verify-email`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code })
                });
                const result = await res.json();
                
                // ЧАСТЬ 1: Исправленная логика обработки ответа
                if (res.ok && result.status === "success") {
                    // 1. Сохраняем JWT-токен
                    if (result.token) {
                        localStorage.setItem("token", result.token);
                    }

                    // 2. Сохраняем данные пользователя
                    if (result.user) {
                        localStorage.setItem("user_name", result.user.name || "");
                        localStorage.setItem("user_id", result.user.id || "");
                    }

                    alert("Регистрация успешно завершена!");

                    // 3. Перенаправляем авторизованным
                    window.location.href = "profile.html"; 
                } else {
                    alert(result.message || result.detail || "Ошибка верификации");
                }
            } catch (e) { alert('Ошибка сети'); }
        });

        let sec = 59;
        const timerText = document.getElementById('timer-text');
        const resendLink = document.getElementById('resend-link');
        const itv = setInterval(() => {
            sec--;
            timerText.innerText = `Отправить повторно через 00:${sec < 10 ? '0'+sec : sec}`;
            if (sec <= 0) {
                clearInterval(itv);
                timerText.style.display = 'none';
                resendLink.classList.remove('disabled');
            }
        }, 1000);

        resendLink.addEventListener('click', async (e) => {
            e.preventDefault();
            alert('Запрос на повторную отправку...');
            window.location.reload();
        });
    </script>
</body>
</html>
