<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение кода — DachaGo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Общие аккуратные стили страницы */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #FFFFFF;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .verify-container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            text-align: center;
            box-sizing: border-box;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #94A3B8;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        #user-email {
            color: #1E293B;
            font-weight: 600;
        }

        /* НАСТРОЙКА ИЗ ТЗ: Контейнер для 6 отдельных квадратиков */
        .code-container {
            display: flex;
            justify-content: center;
            gap: 10px; /* Расстояние между ячейками */
            margin: 24px 0;
            width: 100%;
        }

        /* НАСТРОЙКА ИЗ ТЗ: Маленькие аккуратные квадраты, как раньше */
        .code-input {
            width: 45px !important;
            height: 45px !important;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            background-color: #F8FAFC;
            color: #1E293B;
            outline: none;
            padding: 0 !important;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .code-input:focus {
            border-color: #3B82F6;
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Стиль кнопки отправки */
        .btn-submit {
            width: 100%;
            background-color: #4FA0C8;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 16px;
        }

        .btn-submit:disabled {
            background-color: #CBD5E1;
            cursor: not-allowed;
        }

        .timer-text {
            font-size: 14px;
            color: #64748B;
        }

        .resend-link {
            color: #4FA0C8;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        
        .resend-link.disabled {
            color: #94A3B8;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="verify-container">
        <h2>Введите код</h2>
        <div class="subtitle">
            Мы отправили 6-значный код на почту<br>
            <span id="user-email">loading...</span>
        </div>

        <div class="code-container">
            <input type="text" maxlength="1" class="code-input" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            <input type="text" maxlength="1" class="code-input" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            <input type="text" maxlength="1" class="code-input" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            <input type="text" maxlength="1" class="code-input" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            <input type="text" maxlength="1" class="code-input" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            <input type="text" maxlength="1" class="code-input" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        </div>

        <button id="btn-verify" class="btn-submit" disabled>Подтвердить</button>

        <div class="timer-text">
            Отправить повторно через <span id="timer-count">00:59</span> 
            <span id="resend-btn" class="resend-link disabled" style="display:none;">Отправить код повторно</span>
        </div>
    </div>

    <script>
        (function() {
            // Конфигурация API (подтягиваем твой текущий рабочий Render URL)
            const API_URL = window.DachaGoConfig?.apiUrl || 'https://dev-net-rent.onrender.com/api/v1';
            
            // Получаем email из строки браузера (?email=user@gmail.com)
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email') || '';
            document.getElementById('user-email').innerText = email;

            const inputs = document.querySelectorAll('.code-input');
            const verifyBtn = document.getElementById('btn-verify');

            // Автоматическое переключение между ячейками при вводе
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Разрешаем только цифры
                    input.value = input.value.replace(/[^0-9]/g, '');
                    
                    if (input.value.length > 0 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                    checkFullCode();
                });

                // Возврат назад при нажатии Backspace
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && input.value.length === 0 && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });

            function checkFullCode() {
                const fullCode = Array.from(inputs).map(i => i.value).join('');
                verifyBtn.disabled = (fullCode.length !== 6);
            }

            // НАСТРОЙКА ИЗ ТЗ: Обработка подтверждения и АВТО-ВХОД
            verifyBtn.addEventListener('click', async () => {
                const code = Array.from(inputs).map(i => i.value).join('');
                verifyBtn.disabled = true;
                verifyBtn.innerText = 'Проверка...';

                try {
                    const response = await fetch(`${API_URL}/auth/verify-email`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email, code: code })
                    });

                    const data = await response.json();

                    if (response.ok && data.status === "success") {
                        // ЖЕЛЕЗНО сохраняем токен авторизации и данные юзера в память
                        if (data.token) {
                            localStorage.setItem('token', data.token);
                        }
                        if (data.user) {
                            localStorage.setItem('user', JSON.stringify(data.user));
                        }

                        alert("Регистрация успешно завершена! Вход выполнен.");
                        
                        // Отправляем пользователя сразу на главную страницу уже авторизованным
                        window.location.href = 'index.html';
                    } else {
                        alert(data.message || data.detail || 'Неверный код или срок его действия истёк.');
                        verifyBtn.disabled = false;
                        verifyBtn.innerText = 'Подтвердить';
                    }
                } catch (err) {
                    alert('Ошибка сети при верификации');
                    verifyBtn.disabled = false;
                    verifyBtn.innerText = 'Подтвердить';
                }
            });

            // Простейший таймер для повторной отправки кодов
            let timeLeft = 59;
            const timerCount = document.getElementById('timer-count');
            const resendBtn = document.getElementById('resend-btn');
            
            const timerInterval = setInterval(() => {
                timeLeft--;
                timerCount.innerText = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerCount.parentElement.style.display = 'none';
                    resendBtn.style.display = 'inline';
                    resendBtn.classList.remove('disabled');
                }
            }, 1000);
        })();
    </script>
</body>
</html>
