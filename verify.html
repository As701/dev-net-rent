<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Верификация личности - DachaGo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2599C8;
            --soft-gray: #F7F9FC;
            --text-dark: #1A1D1E;
            --text-light: #9BA5B7;
            --white: #FFFFFF;
            --success-green: #28C76F;
            --danger-red: #EA5455;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--soft-gray); 
            margin: 0; 
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            background: var(--white);
            padding: 60px 24px 25px;
            border-radius: 0 0 35px 35px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            text-align: center;
        }
        .back-btn {
            position: absolute;
            top: 55px;
            left: 20px;
            width: 45px;
            height: 45px;
            background: var(--soft-gray);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            text-decoration: none;
        }
        .title { font-weight: 900; font-size: 22px; margin: 0; }
        
        .content { padding: 30px 24px; flex: 1; }
        
        .card {
            background: var(--white);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            margin-bottom: 25px;
        }
        .section-title {
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-light);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title i { color: var(--primary-blue); }

        .input-group {
            background: var(--soft-gray);
            border-radius: 18px;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 15px;
            border: 1.5px solid transparent;
            transition: 0.3s;
        }
        .input-group:focus-within {
            border-color: var(--primary-blue);
            background: var(--white);
        }
        .input-group label {
            font-size: 10px;
            font-weight: 800;
            color: var(--text-light);
            text-transform: uppercase;
        }
        .input-group input {
            background: transparent;
            border: none;
            outline: none;
            font-weight: 700;
            font-size: 16px;
            color: var(--text-dark);
            width: 100%;
        }

        /* LIVENESS UI */
        .camera-container {
            text-align: center;
            padding: 20px;
            background: #f0f4f8;
            border-radius: 25px;
            border: 2px dashed #d1d9e0;
            position: relative;
        }
        #video-wrap {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 20px;
            border: 5px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            background: #000;
            display: none;
        }
        #video-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        
        .gesture-box {
            background: var(--primary-blue);
            color: white;
            padding: 12px 20px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(37, 153, 200, 0.2);
            transition: 0.3s;
        }
        .btn-primary:disabled {
            background: #E2E8F0;
            color: #94A3B8;
            box-shadow: none;
            cursor: not-allowed;
        }
        
        #preview-img-container {
            display: none;
            text-align: center;
            margin-bottom: 20px;
        }
        #preview-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--success-green);
        }

        .status-badge {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 800;
            font-size: 14px;
            color: var(--success-green);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="profile.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <h1 class="title">Верификация</h1>
    </header>

    <div class="content">
        <div class="card">
            <div class="section-title"><i class="fas fa-id-card"></i> Паспортные данные</div>
            <div class="input-group">
                <label>Серия паспорта</label>
                <input type="text" id="passport-series" placeholder="AA" maxlength="2" style="text-transform: uppercase;">
            </div>
            <div class="input-group">
                <label>Номер паспорта</label>
                <input type="text" id="passport-number" placeholder="1234567" maxlength="7">
            </div>
        </div>

        <div class="card">
            <div class="section-title"><i class="fas fa-face-smile"></i> Liveness Check</div>
            <div class="camera-container">
                <div id="video-wrap">
                    <video id="video-stream" autoplay playsinline></video>
                </div>
                
                <div id="preview-img-container">
                    <img id="preview-img" src="">
                    <div class="status-badge" id="liveness-success"><i class="fas fa-check-circle"></i> Проверка пройдена</div>
                </div>

                <div id="gesture-display" class="gesture-box">Покажите жест: 🖖🏻</div>
                
                <p id="camera-hint" style="font-size: 11px; color: var(--text-light); margin-bottom: 20px;">
                    Нам нужно убедиться, что вы — живой человек. Нажмите кнопку ниже и следуйте инструкциям.
                </p>

                <button class="btn-primary" id="start-camera-btn" style="background: white; color: var(--primary-blue); border: 1.5px solid var(--primary-blue); box-shadow: none;">
                    Включить камеру
                </button>
                <button class="btn-primary" id="capture-btn" style="display: none;">
                    Сделать снимок
                </button>
            </div>
        </div>

        <button class="btn-primary" id="submit-verify-btn" disabled style="margin-top: 10px;">
            Отправить на проверку
        </button>
    </div>

    <canvas id="capture-canvas" style="display: none;"></canvas>

    <script src="config.js"></script>
    <script src="verify.js"></script>
</body>
</html>
