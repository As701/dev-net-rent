<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход / Регистрация - DachaGo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2599C8;
            --soft-gray: #F7F9FC;
            --text-dark: #1A1D1E;
            --text-light: #9BA5B7;
        }
        body { font-family: 'Inter', sans-serif; background-color: white; margin: 0; display: flex; flex-direction: column; min-height: 100vh; color: var(--text-dark); }
        .auth-container { padding: 40px 25px; flex: 1; }
        .back-btn { width: 45px; height: 45px; background: var(--soft-gray); border-radius: 15px; display: flex; align-items: center; justify-content: center; color: var(--text-dark); text-decoration: none; margin-bottom: 30px; }
        
        h1 { font-weight: 800; font-size: 28px; margin-bottom: 10px; }
        p.subtitle { color: var(--text-light); font-size: 14px; margin-bottom: 30px; line-height: 1.5; }

        .tabs { display: flex; background: var(--soft-gray); padding: 5px; border-radius: 18px; margin-bottom: 30px; }
        .tab { flex: 1; padding: 12px; text-align: center; border-radius: 14px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.3s; color: var(--text-light); }
        .tab.active { background: white; color: var(--primary-blue); shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 700; font-size: 12px; margin-bottom: 8px; color: var(--text-dark); }
        .input-wrapper { background: var(--soft-gray); border-radius: 18px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; border: 1px solid #F0F3F6; }
        .input-wrapper i { color: var(--text-light); font-size: 16px; }
        .input-wrapper input { border: none; background: transparent; outline: none; width: 100%; font-size: 14px; font-weight: 500; }

        .submit-btn { width: 100%; background: var(--primary-blue); color: white; border: none; padding: 18px; border-radius: 20px; font-weight: 800; font-size: 15px; margin-top: 10px; box-shadow: 0 10px 20px rgba(0,102,255,0.15); cursor: pointer; }
        
        .divider { display: flex; align-items: center; text-align: center; margin: 30px 0; color: #eee; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #eee; }
        .divider span { padding: 0 15px; color: var(--text-light); }

        .social-btns { display: flex; gap: 15px; }
        .social-btn { flex: 1; border: 1px solid #F0F3F6; border-radius: 18px; padding: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: background 0.2s; }
        .social-btn:active { background: #fcfcfc; }
        .social-btn i { font-size: 20px; }
        .fa-google { color: #DB4437; }
        .fa-apple { color: #000; }
    </style>
</head>
<body>
    <div class="auth-container">
        <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        
        <h1 id="auth-title">С возвращением!</h1>
        <p class="subtitle" id="auth-subtitle">Войдите в аккаунт, чтобы продолжить поиск вашей идеальной дачи.</p>

        <div class="tabs">
            <div class="tab active" id="tab-login" onclick="switchTab('login')">Вход</div>
            <div class="tab" id="tab-register" onclick="switchTab('register')">Регистрация</div>
        </div>

        <form id="auth-form">
            <div class="form-group" id="name-group" style="display: none;">
                <label>ВАШЕ ИМЯ</label>
                <div class="input-wrapper">
                    <i class="far fa-user"></i>
                    <input type="text" id="auth-name" placeholder="Как вас зовут?">
                </div>
            </div>

            <div class="form-group">
                <label>EMAIL ИЛИ ТЕЛЕФОН</label>
                <div class="input-wrapper">
                    <i class="far fa-envelope"></i>
                    <input type="text" id="auth-identifier" placeholder="example@mail.com или +998..." required>
                </div>
            </div>

            <div class="form-group">
                <label>ПАРОЛЬ</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="auth-password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Войти</button>
        </form>

        <div class="divider"><span>или продолжить через</span></div>

        <div class="social-btns">
            <div class="social-btn" onclick="socialAuth('google')">
                <i class="fab fa-google"></i>
            </div>
            <div class="social-btn" onclick="socialAuth('apple')">
                <i class="fab fa-apple"></i>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
