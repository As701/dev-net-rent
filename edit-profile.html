<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование - DachaGo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-blue: #2599C8;
            --soft-gray: #F7F9FC;
            --text-dark: #1A1D1E;
            --text-light: #9BA5B7;
            --white: #FFFFFF;
            --danger: #FF3B30;
            --success: #28C76F;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--soft-gray); margin: 0; padding-bottom: 40px; color: var(--text-dark); -webkit-font-smoothing: antialiased; }

        .header {
            background: var(--white);
            padding: 50px 24px 25px;
            border-radius: 0 0 35px 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 20px; }        
        .back-btn { width: 45px; height: 45px; background: var(--soft-gray); border-radius: 15px; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; font-size: 18px; color: var(--text-dark); }    
        .header-title { font-weight: 900; font-size: 20px; margin: 0; }        
        .cancel-link { font-size: 14px; font-weight: 700; color: var(--text-light); text-decoration: none; }

        .form-container { padding: 25px 24px; }
        .card { background: var(--white); border-radius: 35px; padding: 30px 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); border: 1px solid #F0F3F6; margin-bottom: 20px; }

        .avatar-edit-wrap { position: relative; width: 110px; height: 110px; margin: 0 auto 30px; cursor: pointer; }
        .avatar-edit-img { width: 100%; height: 100%; border-radius: 35px; object-fit: cover; background: var(--soft-gray); padding: 4px; border: 1px solid #eee; }
        .camera-overlay { position: absolute; bottom: -5px; right: -5px; width: 34px; height: 34px; background: var(--brand-blue); color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 3px solid white; font-size: 13px; }

        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; font-weight: 800; font-size: 12px; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; padding-left: 5px; }
        .input-group input, .input-group textarea {
            width: 100%;
            background: #F8FAFC;
            border: 1.5px solid #E2E8F0;
            padding: 16px 20px;
            border-radius: 18px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }
        .input-group input:focus, .input-group textarea:focus {
            background: white;
            border-color: var(--brand-blue);
            box-shadow: 0 10px 20px rgba(37, 153, 200, 0.05);
        }

        .input-readonly { background: #F1F5F9 !important; color: #64748B !important; border: 1.5px solid transparent !important; cursor: not-allowed; }
        
        .badge-verified {
            display: none;
            font-size: 10px;
            font-weight: 800;
            color: var(--success);
            text-transform: uppercase;
            margin-left: 8px;
        }
        .badge-verified.active { display: inline; }

        .save-btn { width: 100%; background: var(--brand-blue); color: white; border: none; padding: 18px; border-radius: 20px; font-weight: 900; font-size: 15px; letter-spacing: 0.5px; cursor: pointer; margin-top: 10px; box-shadow: 0 10px 25px rgba(37, 153, 200, 0.3); transition: 0.3s; }
        .save-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <button class="back-btn" id="back-trigger"><i class="fas fa-chevron-left"></i></button>
            <h2 class="header-title">Редактирование</h2>
        </div>
        <a href="#" class="cancel-link" id="cancel-trigger">Отмена</a>   
    </header>

    <div class="form-container">
        <div class="card">
            <!-- AVATAR -->
            <div class="avatar-edit-wrap" id="avatar-picker-trigger">
                <img id="edit-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" class="avatar-edit-img">
                <div class="camera-overlay"><i class="fas fa-camera"></i></div>
            </div>

            <!-- NAME (Required) -->
            <div class="input-group">
                <label>Имя <span style="color: var(--danger);">*</span></label>
                <input type="text" id="edit-name" placeholder="Как вас зовут?">
            </div>

            <!-- ABOUT (Optional) -->
            <div class="input-group">
                <label>О себе (Bio)</label>
                <textarea id="edit-bio" rows="3" placeholder="Расскажите немного о себе..."></textarea>
            </div>

            <!-- EMAIL (Locked) -->
            <div class="input-group">
                <label>Email (нельзя менять)</label>
                <input type="email" id="edit-email" class="input-readonly" readonly>
            </div>

            <!-- PHONE (Lazy Verification) -->
            <div class="input-group">
                <label>Номер телефона <span id="phone-status" class="badge-verified">Подтвержден</span></label>
                <input type="text" id="edit-phone" class="input-readonly" readonly placeholder="Номер подтверждается при бронировании">
            </div>

            <!-- READ ONLY FIELDS -->
            <div class="input-group">
                <label>ID Пользователя</label>
                <input type="text" id="display-id" class="input-readonly" readonly>
            </div>

            <div class="input-group">
                <label>Роль</label>
                <input type="text" id="display-role" class="input-readonly" readonly>
            </div>

            <button class="save-btn" id="save-profile-btn">Сохранить изменения</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="edit-profile.js"></script>
</body>
</html>
