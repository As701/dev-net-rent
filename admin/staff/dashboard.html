<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DachaGo STAFF - Control Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../admin-style.css">
    <style>
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .stat-card .val { font-size: 24px; font-weight: 900; color: var(--brand-blue); }
        .stat-card .label { font-size: 9px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; margin-top: 5px; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo"><i class="fas fa-shield-halved"></i> DachaGo</div>
        <div class="nav-item active" data-view="dash"><i class="fas fa-chart-line"></i> Обзор</div>
        <div class="nav-item" data-view="listings"><i class="fas fa-home"></i> Модерация</div>
        <div class="nav-item" data-view="users"><i class="fas fa-users"></i> Пользователи</div>
        <div class="nav-item" data-view="messages"><i class="fas fa-comment-dots"></i> Сообщения</div>
        <div class="nav-item" data-view="profile"><i class="fas fa-user-circle"></i> Профиль</div>
        <div class="nav-item logout" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Выйти</div>
    <main class="main">
        <header class="header">
            <div class="view-title" id="page-title">MODERATOR PANEL</div>
            <div style="display:flex; align-items:center; gap:20px;">
                <input type="text" id="global-search" placeholder="Поиск (ID/Email)..." style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); padding:10px 15px; border-radius:12px; color:white; font-size:12px; width:220px;">
                <div class="user-status">
                    <div style="text-align: right;">
                        <div id="user-name" style="font-weight: 800; font-size: 13px;">Admin</div>
                        <div class="role-label" style="color:var(--brand-blue); font-size:9px; font-weight:900;">ADMINISTRATOR</div>
                    </div>
                    <img id="user-avatar" src="">
                </div>
            </div>
        </header>

        <div class="content">
    ...
        </div>
    </main>

    <!-- SEARCH MODAL -->
    <div class="modal-overlay" id="search-modal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:3000; align-items:center; justify-content:center;">
        <div class="modal-content" style="background:var(--dark); padding:40px; border-radius:30px; border:1px solid rgba(255,255,255,0.1); width:90%; max-width:800px; color:white;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                <h2 id="modal-title" style="margin:0;">Результат поиска</h2>
                <button class="btn btn-outline" onclick="closeModal()">ЗАКРЫТЬ</button>
            </div>
            <div id="modal-body-content"></div>
        </div>
    </div>
            <div id="dash-view" class="view-section active">
                <div class="stat-grid">
                    <div class="stat-card"><div class="val" id="st-users">0</div><div class="label">Пользователи</div></div>
                    <div class="stat-card"><div class="val" id="st-active" style="color:var(--success)">0</div><div class="label">Активные</div></div>
                    <div class="stat-card"><div class="val" id="st-pending" style="color:var(--warning)">0</div><div class="label">На модерации</div></div>
                    <div class="stat-card"><div class="val" id="st-rejected" style="color:var(--danger)">0</div><div class="label">Отклонённые</div></div>
                </div>

                <div class="data-card">
                    <div class="card-header">Объявления на проверке</div>
                    <table id="pending-table">
                        <thead><tr><th>ID Объекта</th><th>Название</th><th>Владелец (ID)</th><th>Дата</th><th>Статус</th><th>Действия</th></tr></thead>
                        <tbody id="pending-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- DYNAMIC AREA -->
            <div id="dynamic-view" style="display:none;">
                <div class="data-card">
                    <div class="card-header"><h3 id="table-title">...</h3></div>
                    <div id="view-container"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="../../client/config.js"></script>
    <script src="staff.js"></script>
</body>
</html>
