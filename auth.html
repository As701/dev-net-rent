<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Вход и Регистрация - DachaGo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2599C8;
            --brand-color: #2b96cd;
            --soft-gray: #F7F9FC;
            --text-dark: #1A1D1E;
            --text-light: #9BA5B7;
            --danger-red: #EA5455;
            --success-green: #28C76F;
            --border-color: #F0F3F6;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: white; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100dvh; 
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* Mobile Fixes for iPhone */
        input, textarea, select {
            font-size: 18px !important;
            -webkit-text-size-adjust: 100%;
        }

        .auth-container { 
            padding: 30px 25px; 
            flex: 1; 
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            transition: all 0.4s ease;
        }

        .header { margin-bottom: 30px; }
        .back-btn { width: 45px; height: 45px; background: var(--soft-gray); border-radius: 15px; display: flex; align-items: center; justify-content: center; color: var(--text-dark); text-decoration: none; margin-bottom: 25px; transition: transform 0.2s; }
        .back-btn:active { transform: scale(0.95); }

        h1 { font-weight: 800; font-size: 28px; margin: 0 0 8px 0; }
        p.subtitle { color: var(--text-light); font-size: 14px; margin: 0; line-height: 1.5; }        

        /* SCREEN TOGGLE */
        .screen { display: none; }
        .screen.active { display: block; animation: screenIn 0.4s ease-out; }
        @keyframes screenIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .screen.exit { animation: screenOut 0.4s ease-in forwards; }
        @keyframes screenOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }

        /* Tabs */
        .tabs { display: flex; background: var(--soft-gray); padding: 5px; border-radius: 18px; margin-bottom: 30px; }
        .tab { flex: 1; padding: 12px; text-align: center; border-radius: 14px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.3s; color: var(--text-light); }
        .tab.active { color: var(--primary-blue); background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* Form Controls */
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: block; font-weight: 700; font-size: 12px; margin-bottom: 8px; color: var(--text-dark); text-transform: uppercase; letter-spacing: 0.5px; }
        
        .input-wrapper { 
            background: var(--soft-gray); 
            border-radius: 18px; 
            padding: 14px 18px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .input-wrapper:focus-within { border-color: var(--brand-color); background: white; }
        .input-wrapper.error { border-color: var(--danger-red); }

        .input-wrapper i.field-icon { color: var(--text-light); font-size: 16px; width: 20px; text-align: center; }
        .input-wrapper input { border: none; background: transparent; outline: none; width: 100%; font-weight: 500; color: var(--text-dark); }

        .toggle-pass { color: var(--text-light); cursor: pointer; padding: 5px; }
        .error-msg { color: var(--danger-red); font-size: 11px; font-weight: 600; margin-top: 6px; padding-left: 5px; min-height: 14px; }

        /* OTP DISPLAY */
        .otp-box {
            background: var(--soft-gray);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
        }
        .otp-main-input {
            width: 100%;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 15px;
            font-size: 32px;
            text-align: center;
            letter-spacing: 15px;
            font-weight: 800;
            color: var(--brand-color);
            outline: none;
            transition: 0.3s;
        }
        .otp-main-input:focus { border-color: var(--brand-color); }
        
        .timer-text { font-size: 13px; color: var(--text-light); margin: 20px 0; font-weight: 600; }
        .resend-link { font-size: 14px; font-weight: 800; color: var(--brand-color); text-decoration: none; transition: 0.3s; }
        .resend-link.disabled { color: #D1D8E0; pointer-events: none; }

        /* Success Animation */
        .success-box {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 15px 35px rgba(43, 150, 205, 0.3);
            position: relative;
        }
        .checkmark {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: block;
            stroke-width: 5;
            stroke: var(--brand-color);
            stroke-miterlimit: 10;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        @keyframes stroke { 100% { stroke-dashoffset: 0; } }

        /* Submit Button */
        .submit-btn { 
            width: 100%; 
            background: var(--primary-blue); 
            color: white; 
            border: none; 
            padding: 18px; 
            border-radius: 20px; 
            font-weight: 800; 
            font-size: 16px; 
            margin-top: 10px; 
            box-shadow: 0 10px 25px rgba(37, 153, 200, 0.2); 
            cursor: pointer; 
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .loader { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .divider { display: flex; align-items: center; text-align: center; margin: 30px 0; color: var(--border-color); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1.5px solid var(--border-color); }
        .divider span { padding: 0 15px; color: var(--text-light); }

        .social-btns { display: flex; gap: 15px; }
        .social-btn { flex: 1; border: 2px solid var(--border-color); border-radius: 18px; padding: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: all 0.2s; }
        .social-btn i { font-size: 20px; }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- HEADER -->
        <div class="header" id="auth-header">
            <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
            <h1 id="auth-title">С возвращением!</h1>
            <p class="subtitle" id="auth-subtitle">Войдите в аккаунт, чтобы продолжить поиск вашей идеальной дачи.</p>
        </div>

        <!-- SCREEN 1: INPUT -->
        <div id="screen-input" class="screen active">
            <div class="tabs">
                <div class="tab active" data-tab="login">Вход</div>
                <div class="tab" data-tab="register">Регистрация</div>
            </div>

            <form id="auth-form" autocomplete="off" novalidate>
                <div class="form-group" id="group-name" style="display: none;">
                    <label>Ваше имя</label>
                    <div class="input-wrapper">
                        <i class="far fa-user field-icon"></i>
                        <input type="text" id="input-name" placeholder="Введите имя">
                    </div>
                    <div class="error-msg" id="error-name"></div>
                </div>

                <div class="form-group">
                    <label>Email или телефон</label>
                    <div class="input-wrapper">
                        <i class="far fa-envelope field-icon" id="identity-icon"></i>
                        <input type="text" id="input-identity" placeholder="example@mail.com или +998...">
                    </div>
                    <div class="error-msg" id="error-identity"></div>
                </div>

                <div class="form-group">
                    <label>Пароль</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock field-icon"></i>
                        <input type="password" id="input-password" placeholder="••••••••">
                        <i class="far fa-eye toggle-pass"></i>
                    </div>
                    <div class="error-msg" id="error-password"></div>
                </div>

                <button type="submit" class="submit-btn" id="btn-submit">
                    <span class="loader"></span>
                    <span class="btn-text">Войти</span>
                </button>
            </form>

            <div class="divider"><span>или продолжить через</span></div>
            <div class="social-btns">
                <div class="social-btn" onclick="alert('Google Auth soon')"><i class="fab fa-google" style="color:#DB4437"></i></div>
                <div class="social-btn" onclick="alert('Apple Auth soon')"><i class="fab fa-apple"></i></div>
            </div>
        </div>

        <!-- SCREEN 2: OTP -->
        <div id="screen-otp" class="screen">
            <h1 style="text-align: center; font-size: 24px; margin-bottom: 10px;">Введите код</h1>
            <p class="subtitle" style="text-align: center; margin-bottom: 30px;">Мы отправили 6-значный код на <br><strong id="display-user-email" style="color: var(--text-dark);"></strong></p>
            
            <div class="otp-box">
                <input type="text" id="otp-main-input" class="otp-main-input" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="000000">
                <div class="timer-text" id="otp-timer">Повторный запрос кода доступен через 00:59</div>
                <a href="#" id="resend-otp" class="resend-link disabled">Отправить код повторно</a>
            </div>

            <button class="submit-btn" id="btn-verify-otp">
                <span class="loader"></span>
                <span class="btn-text">Подтвердить</span>
            </button>
        </div>

        <!-- SCREEN 3: SUCCESS -->
        <div id="screen-success" class="screen" style="text-align: center; padding-top: 40px;">
            <div class="success-box">
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <path fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>
            <h1 style="font-size: 24px; margin-bottom: 10px;">Verified successfully</h1>
            <p class="subtitle">Добро пожаловать в DachaGo!</p>
        </div>

    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
