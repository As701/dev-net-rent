<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Вход и Регистрация - DachaGo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2599C8;
            --brand-color: #2b96cd;
            --soft-gray: #F7F9FC;
            --text-dark: #1A1D1E;
            --text-light: #9BA5B7;
            --danger-red: #EA5455;
            --success-green: #2ECC71;
            --border-color: #F0F3F6;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        input, textarea, select {
            font-size: 18px !important;
            -webkit-text-size-adjust: 100%;
        }

        .auth-container {
            padding: 30px 25px 60px;
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            transition: all 0.4s ease;
        }

        .header { margin-bottom: 30px; }
        .back-btn { width: 45px; height: 45px; background: var(--soft-gray); border-radius: 15px; display: flex; align-items: center; justify-content: center; color: var(--text-dark); text-decoration: none; margin-bottom: 25px; transition: transform 0.2s; }
        .back-btn:active { transform: scale(0.95); }

        h1 { font-weight: 800; font-size: 28px; margin: 0 0 8px 0; }
        p.subtitle { color: var(--text-light); font-size: 14px; margin: 0 0 32px 0; line-height: 1.5; }

        .screen { display: none; }
        .screen.active { display: block; animation: screenIn 0.4s ease-out; }  
        @keyframes screenIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tabs { display: flex; background: var(--soft-gray); padding: 5px; border-radius: 18px; margin-bottom: 30px; }
        .tab { flex: 1; padding: 12px; text-align: center; border-radius: 14px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.3s; color: var(--text-light); }
        .tab.active { color: var(--primary-blue); background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: block; font-weight: 700; font-size: 12px; margin-bottom: 8px; color: var(--text-dark); text-transform: uppercase; letter-spacing: 0.5px; }

        .input-wrapper {
            background: var(--soft-gray);
            border-radius: 18px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 2px solid transparent;
            transition: all 0.2s;
            position: relative;
        }
        .input-wrapper:focus-within { border-color: var(--brand-color); background: white; }
        .input-wrapper.valid { border-color: var(--success-green); background: white; }
        .input-wrapper.error { border-color: var(--danger-red); }

        .input-wrapper i.field-icon { color: var(--text-light); font-size: 16px; width: 20px; text-align: center; }
        .input-wrapper input { border: none; background: transparent; outline: none; width: 100%; font-weight: 500; color: var(--text-dark); }

        /* Country Prefix Styling */
        .country-prefix {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 16px;
            display: none; /* Hidden by default, shown in phone mode */
        }
        .phone-mode .country-prefix { display: block; }
        .phone-mode #identity-icon { display: none; }

        .valid-check { color: var(--success-green); font-size: 14px; display: none; }
        .input-wrapper.valid .valid-check { display: block; }

        .toggle-pass { color: var(--text-light); cursor: pointer; padding: 5px; }
        .error-msg { color: var(--danger-red); font-size: 11px; font-weight: 600; margin-top: 6px; padding-left: 5px; min-height: 14px; }

        .pass-requirements { margin: 10px 5px 20px; display: none; }
        .pass-requirements.visible { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .req-item { font-size: 12px; color: var(--text-light); display: flex; align-items: center; gap: 6px; font-weight: 600; transition: all 0.3s; }        
        .req-item i { font-size: 10px; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1.5px solid #D1D8E0; transition: all 0.3s; color: transparent; }
        .req-item.met { color: var(--success-green); }
        .req-item.met i { border-color: var(--success-green); color: var(--success-green); }

        .submit-btn {
            width: 100%;
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 16px;
            margin-top: 10px;
            box-shadow: 0 10px 25px rgba(37, 153, 200, 0.2);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .loader { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .divider { display: flex; align-items: center; text-align: center; margin: 30px 0; color: var(--border-color); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1.5px solid var(--border-color); }
        .divider span { padding: 0 15px; color: var(--text-light); }

        .social-btns { display: flex; gap: 15px; }
        .social-btn { flex: 1; border: 2px solid var(--border-color); border-radius: 18px; padding: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: all 0.2s; }
        .social-btn i { font-size: 20px; }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- HEADER -->
        <div class="header" id="auth-header">
            <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
            <h1 id="auth-title">С возвращением!</h1>
            <p class="subtitle" id="auth-subtitle">Войдите в аккаунт, чтобы продолжить поиск вашей идеальной дачи.</p>
        </div>

        <!-- SCREEN 1: INPUT -->
        <div id="screen-input" class="screen active">
            <div class="tabs">
                <div class="tab active" data-tab="login">Вход</div>        
                <div class="tab" data-tab="register">Регистрация</div>
            </div>

            <form id="auth-form" autocomplete="off" novalidate>
                <div class="form-group" id="group-name" style="display: none;">
                    <label>Ваше имя</label>
                    <div class="input-wrapper">
                        <i class="far fa-user field-icon"></i>
                        <input type="text" id="input-name" placeholder="Введите имя">
                        <i class="fas fa-check-circle valid-check"></i>        
                    </div>
                    <div class="error-msg" id="error-name"></div>
                </div>

                <div class="form-group">
                    <label id="identity-label">Email или телефон</label>
                    <div class="input-wrapper" id="identity-wrapper">
                        <i class="far fa-envelope field-icon" id="identity-icon"></i>
                        <span class="country-prefix" id="identity-prefix">+998</span>
                        <input type="text" id="input-identity" placeholder="example@mail.com или +998...">
                        <i class="fas fa-check-circle valid-check"></i>        
                    </div>
                    <div class="error-msg" id="error-identity"></div>
                </div>

                <div class="form-group">
                    <label>Пароль</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock field-icon"></i>
                        <input type="password" id="input-password" placeholder="••••••••">
                        <i class="far fa-eye toggle-pass"></i>
                        <i class="fas fa-check-circle valid-check" style="right: 45px;"></i>
                    </div>
                    <div class="error-msg" id="error-password"></div>

                    <div class="pass-requirements" id="pass-reqs">
                        <div class="req-item" data-req="len"><i>✓</i> Минимум 8 символов</div>
                        <div class="req-item" data-req="case"><i>✓</i> Заглавная и строчная</div>
                        <div class="req-item" data-req="num"><i>✓</i> Минимум 1 цифра</div>
                        <div class="req-item" data-req="spec"><i>✓</i> Спецсимвол (!@#$%^&*)</div>
                    </div>
                </div>

                <div class="form-group" id="group-confirm" style="display: none;">
                    <label>Подтверждение пароля</label>     
                    <div class="input-wrapper">
                        <i class="fas fa-lock field-icon"></i>
                        <input type="password" id="input-confirm" placeholder="••••••••">
                        <i class="far fa-eye toggle-pass"></i>
                        <i class="fas fa-check-circle valid-check" style="right: 45px;"></i>
                    </div>
                    <div class="error-msg" id="error-confirm"></div>
                </div>

                <button type="submit" class="submit-btn" id="btn-submit">      
                    <span class="loader"></span>
                    <span class="btn-text">Войти</span>
                </button>
            </form>

            <div class="divider"><span>или продолжить через</span></div>
            <div class="social-btns">
                <div class="social-btn" onclick="alert('Google Auth soon')"><i class="fab fa-google" style="color:#DB4437"></i></div>
                <div class="social-btn" onclick="alert('Apple Auth soon')"><i class="fab fa-apple"></i></div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
